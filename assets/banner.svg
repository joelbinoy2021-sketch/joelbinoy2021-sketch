<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .terminal-title { font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace; font-size: 13px; fill: #64748b; font-weight: 500; }
    .command { font-family: 'Fira Code', 'Courier New', monospace; font-size: 14px; fill: #38bdf8; font-weight: 600; }
    .command-arg { fill: #f43f5e; }
    .main-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif; font-size: 38px; font-weight: 800; letter-spacing: -0.5px; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; font-size: 15px; fill: #94a3b8; font-weight: 400; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; fill: #e2e8f0; font-weight: 600; }
  </style>

  <!-- Outer Card with Glowing Border -->
  <rect x="2" y="2" width="846" height="236" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Background Decorative Cyber Lines -->
  <path d="M 600 2 L 680 80 L 848 80" fill="none" stroke="#00f0ff" stroke-opacity="0.08" stroke-width="1.5" />
  <path d="M 640 2 L 720 80 L 848 80" fill="none" stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1.5" />
  <circle cx="680" cy="80" r="3" fill="#00f0ff" fill-opacity="0.2" />
  <circle cx="720" cy="80" r="3" fill="#8b5cf6" fill-opacity="0.2" />

  <!-- Terminal Top Bar -->
  <rect x="2" y="2" width="846" height="38" rx="14" fill="#0b1120" fill-opacity="0.8" />
  <line x1="2" y1="40" x2="848" y2="40" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="425" y="25" text-anchor="middle" class="terminal-title">⚡ joel-binoy@developer-terminal:~</text>

  <!-- Content Section -->
  <!-- Prompt line -->
  <text x="32" y="74" class="command">
    <tspan fill="#10b981">➜</tspan>
    <tspan fill="#38bdf8"> ~</tspan>
    <tspan fill="#94a3b8"> whoami --role</tspan>
    <tspan class="command-arg"> "Cybersecurity &amp; Full-Stack"</tspan>
  </text>

  <!-- Main Name with Neon Gradient -->
  <text x="32" y="122" class="main-name" fill="url(#textGrad)">Hi, I'm Joel Binoy <tspan font-size="30">👋</tspan></text>

  <!-- Tagline -->
  <text x="32" y="152" class="tagline">
    Turning ideas into interactive web platforms &bull; Learning, crafting &amp; breaking code safely
  </text>

  <!-- Feature Pills -->
  <g transform="translate(32, 176)">
    <!-- Pill 1: Cybersecurity -->
    <rect x="0" y="0" width="145" height="30" rx="8" fill="url(#pillGrad)" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#00f0ff" />
    <text x="28" y="20" class="pill-text">Cybersecurity</text>

    <!-- Pill 2: Web Dev -->
    <rect x="157" y="0" width="158" height="30" rx="8" fill="url(#pillGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="173" cy="15" r="4" fill="#a855f7" />
    <text x="185" y="20" class="pill-text">Web Development</text>

    <!-- Pill 3: Python -->
    <rect x="327" y="0" width="135" height="30" rx="8" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="343" cy="15" r="4" fill="#38bdf8" />
    <text x="355" y="20" class="pill-text">Python &amp; C/Java</text>

    <!-- Pill 4: SIH & I²U -->
    <rect x="474" y="0" width="170" height="30" rx="8" fill="url(#pillGrad)" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="490" cy="15" r="4" fill="#f43f5e" />
    <text x="502" y="20" class="pill-text">SIH &amp; I²U 2025 Funded</text>
  </g>
</svg>
