<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 70" width="100%" height="100%">
  <defs>
    <linearGradient id="footerLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; font-weight: 500; }
    .heart { fill: #ef4444; }
  </style>

  <!-- Glowing divider line -->
  <line x1="20" y1="20" x2="830" y2="20" stroke="url(#footerLineGrad)" stroke-width="2" />

  <!-- Center Diamond Accent -->
  <polygon points="425,14 431,20 425,26 419,20" fill="#a855f7" />

  <!-- Footer Text -->
  <text x="425" y="48" text-anchor="middle" class="footer-text">
    Crafted with <tspan class="heart">&hearts;</tspan> by <tspan fill="#e2e8f0" font-weight="600">Joel Binoy</tspan> &bull; Amal Jyothi College of Engineering
  </text>
</svg>
